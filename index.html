<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>五合一小遊戲</title>
<style>
body{
    text-align:center;
    font-family:Arial;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
<a href="index.html">
  <button style="position:fixed; top:10px; left:10px; padding:10px 20px; font-size:16px; border-radius:8px; background:#ff6a00; color:white; border:none; cursor:pointer;">
    🏠 返回首頁
  </button>
</a> }
#gameArea{
    width:320px;
    height:320px;
    background:white;
    margin:20px auto;
    position:relative;
    overflow:hidden;
    border-radius:15px;
}
button{
    margin:5px;
    padding:8px 15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
.cell{
    width:100px;
    height:100px;
    float:left;
    border:1px solid #ddd;
    font-size:40px;
    line-height:100px;
    color:black;
}
</style>
</head>
<body>

<h1>🎮 超級小遊戲合集</h1>

<div>
<button onclick="clickGame()">👾 點擊</button>
<button onclick="guessGame()">🔢 猜數字</button>
<button onclick="dodgeGame()">💣 躲炸彈</button>
<button onclick="memoryGame()">🧠 記憶</button>
<button onclick="runnerGame()">🏃 跑酷</button>
</div>

<div id="gameArea"></div>
<p id="info"></p>

<script>
let gameArea=document.getElementById("gameArea");
let info=document.getElementById("info");
let interval;

// =================== 點擊遊戲 ===================
function clickGame(){
clearAll();
let score=0;
info.textContent="點擊 👾 得分！";
interval=setInterval(()=>{
let m=document.createElement("div");
m.textContent="👾";
m.style.position="absolute";
m.style.left=Math.random()*280+"px";
m.style.top=Math.random()*280+"px";
m.onclick=function(){
score++;
info.textContent="分數："+score;
gameArea.removeChild(m);
}
gameArea.appendChild(m);
setTimeout(()=>{if(m.parentNode)gameArea.removeChild(m)},800);
},700);
}

// =================== 猜數字 ===================
function guessGame(){
clearAll();
let number=Math.floor(Math.random()*100)+1;
info.innerHTML="猜1~100<br>";
let input=document.createElement("input");
let btn=document.createElement("button");
btn.textContent="猜";
btn.onclick=function(){
if(input.value==number){
info.textContent="🎉 猜對了！";
}else if(input.value<number){
info.textContent="太小了";
}else{
info.textContent="太大了";
}
}
gameArea.appendChild(input);
gameArea.appendChild(btn);
}

// =================== 躲炸彈 ===================
function dodgeGame(){
clearAll();
let player=document.createElement("div");
player.textContent="😀";
player.style.position="absolute";
player.style.left="140px";
player.style.bottom="0px";
player.style.fontSize="30px";
gameArea.appendChild(player);
info.textContent="滑鼠移動躲開 💣";

gameArea.onmousemove=function(e){
player.style.left=e.offsetX+"px";
}

interval=setInterval(()=>{
let bomb=document.createElement("div");
bomb.textContent="💣";
bomb.style.position="absolute";
bomb.style.left=Math.random()*280+"px";
bomb.style.top="0px";
gameArea.appendChild(bomb);

let fall=setInterval(()=>{
bomb.style.top=parseInt(bomb.style.top)+5+"px";
if(parseInt(bomb.style.top)>300){
clearInterval(fall);
gameArea.removeChild(bomb);
}
if(Math.abs(parseInt(bomb.style.left)-parseInt(player.style.left))<30 
&& parseInt(bomb.style.top)>260){
clearInterval(interval);
alert("💥 被炸到了！");
}
},50);
},800);
}

// =================== 記憶遊戲 ===================
function memoryGame(){
clearAll();
info.textContent="找出兩個一樣的圖案";
let icons=["🍎","🍎","🍌","🍌","🍇","🍇","🍓","🍓"];
icons.sort(()=>0.5-Math.random());
let first=null;

for(let i=0;i<8;i++){
let c=document.createElement("div");
c.className="cell";
c.dataset.icon=icons[i];
c.onclick=function(){
if(c.textContent!="")return;
c.textContent=c.dataset.icon;
if(!first){
first=c;
}else{
if(first.dataset.icon!=c.dataset.icon){
setTimeout(()=>{
first.textContent="";
c.textContent="";
},500);
}
first=null;
}
}
gameArea.appendChild(c);
}
}

// =================== 跑酷遊戲 ===================
function runnerGame(){
clearAll();
info.textContent="按空白鍵跳躍！";
let player=document.createElement("div");
player.textContent="🏃";
player.style.position="absolute";
player.style.bottom="0px";
player.style.left="50px";
player.style.fontSize="30px";
gameArea.appendChild(player);

document.onkeydown=function(e){
if(e.code==="Space"){
player.style.bottom="80px";
setTimeout(()=>player.style.bottom="0px",300);
}
}

interval=setInterval(()=>{
let block=document.createElement("div");
block.textContent="⬛";
block.style.position="absolute";
block.style.bottom="0px";
block.style.left="300px";
gameArea.appendChild(block);

let move=setInterval(()=>{
block.style.left=parseInt(block.style.left)-5+"px";
if(parseInt(block.style.left)<0){
clearInterval(move);
gameArea.removeChild(block);
}
if(parseInt(block.style.left)<70 && parseInt(player.style.bottom)==="0"){
alert("撞到了！");
clearInterval(interval);
}
},30);
},1500);
}

// ===================
function clearAll(){
clearInterval(interval);
gameArea.innerHTML="";
gameArea.onmousemove=null;
document.onkeydown=null;
info.textContent="";
}
    1.0 by Chat GPT
</script>

</body>
</html>
